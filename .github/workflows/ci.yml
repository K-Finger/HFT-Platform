name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libssl-dev

      # Apps are built but never run: they need a pinned core and CAP_SYS_NICE,
      # which a shared runner cannot provide.
      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DHFT_BUILD_BENCH=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run tests
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          find include src apps tests bench -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror

  tidy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libssl-dev clang-tidy

      # Configure only: clang-tidy reads flags from compile_commands.json and
      # does not need the project actually built. Bench stays out of scope,
      # same as build-and-test, since it is not part of the enforced build.
      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DHFT_BUILD_BENCH=OFF

      - name: Run clang-tidy
        run: |
          find src apps tests -name '*.cpp' \
            | xargs clang-tidy -p build --warnings-as-errors='*'
